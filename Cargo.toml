[package]
name = "shielded_transport_pigeon"
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ShieldedLabs/shielded_transport_pigeon"
description = "Encrypted, caller-driven UDP message transport with bounded lock-free rings and forward error correction."

[dependencies]
curve25519-dalek = "4.1.3"
blake3 = { version = "1.8.2", default-features = false, features = ["std", "pure"] }

[dependencies.snow]
package = "shielded_labs_snow"
version = "0.10.0"
default-features = false
features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"]

[features]
# RESEARCH-ONLY observation telemetry for size-sweep-cohort (no behaviour change). Off by default.
research_cohort_observer = []
research_budget_diagnostic = ["research_cohort_observer"]
# RESEARCH-ONLY matched L15/L25 ceiling selection; does not change repair demand.
research_budget25 = ["research_budget_diagnostic"]
# RESEARCH-ONLY empirical Q(.01) vs Q(.001); IID prior remains .001 in both arms.
research_empirical_calibration = ["research_budget25"]
# Research overrides for the shipped uncapped smooth retry-risk budget.
research_cost_smooth = ["research_empirical_calibration"]
# Research telemetry/overrides; normal builds already use the frozen target_mix policy.
research_target_validation = ["research_cost_smooth"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cosmo)'] }
